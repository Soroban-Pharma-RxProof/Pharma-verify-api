name: Feature Request
description: Propose a new feature or architectural enhancement
title: "[FEATURE]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to the Pharma Verify API!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation.
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the changes or new capabilities you would like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, diagrams, or references.
